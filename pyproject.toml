[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-icu"
version = "2.0.0"
description = "Multi-agent ICU patient deterioration detection system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100,<1.0",
    "starlette>=0.40,<0.53",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic>=2.7,<3.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "torch>=2.2",
    "xgboost>=2.0,<4.0",
    "scikit-learn>=1.4,<2.0",
    "shap>=0.45",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
